<title>雨夜便利店街角</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  /* Single dark look: a lit diorama floating in a night void. No UI. */
  :root { --void: #070912; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--void); overflow: hidden; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; outline: none; touch-action: none;
    opacity: 0; transition: opacity 1.8s ease;
  }
  canvas.ready { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { canvas { transition: none; } }
</style>

  }
}
</script>
